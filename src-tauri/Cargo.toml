[package]
name = "colloquium"
version = "0.5.1"
description = "Colloquium — peer-to-peer chat and voice/video"
authors = ["Colloquium"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "colloquium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Encryption at rest: build a keyed (SQLCipher) sqlx pool ourselves and inject
# it into the plugin's DbInstances. The libsqlite3-sys pin must track the
# version sqlx 0.8 resolves (0.30.1 today); its bundled-sqlcipher feature
# flips the shared SQLite build to SQLCipher (still with FTS5) via feature
# unification, no [patch] needed.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
libsqlite3-sys = { version = "0.30.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
futures-core = "0.3"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "crypto-rust"] }
serde_json = "1.0.151"

# Watch-party playback (media.rs): a loopback HTTP server that proxies the
# remote source over plain http, because the bundled ffmpeg has no `https`
# protocol, and serves back the HLS segments ffmpeg produces. All of these were
# already in Cargo.lock transitively (tauri/reqwest pull them), so this only
# makes them direct. reqwest is pinned to `native-tls` — Security.framework on
# macOS, schannel on Windows — because reqwest 0.13's `default-tls` is rustls,
# whose aws-lc-rs crypto provider needs NASM and CMake to build on Windows.
# native-tls needs no build tooling and uses the system trust store, so a
# corporate root CA keeps working.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "net", "rt", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

# macOS system-audio capture (ScreenCaptureKit). WKWebView can't capture
# display audio via getDisplayMedia, so we tap it natively and inject it into
# the WebRTC stream. excludesCurrentProcessAudio keeps the app's own output
# (i.e. the call itself) out of the capture, preventing feedback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
objc2-core-media = { version = "0.3", features = [
    "CMBase",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "objc2-core-audio-types",
] }
objc2-app-kit = "0.3"

# Windows system-audio capture (WASAPI process loopback). getDisplayMedia on
# Windows taps a whole-system loopback that recaptures the call's own output
# and echoes it back; instead we capture natively in EXCLUDE-target-process-tree
# mode so Colloquium's own audio is left out.
[target.'cfg(target_os = "windows")'.dependencies]
# Camera/mic permission grant (see `grant_media_capture` in lib.rs). Must track
# the version tauri itself uses, since we hand types back to its webview.
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

