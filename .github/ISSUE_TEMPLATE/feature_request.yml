name: Feature request
description: Suggest something Colloquium should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation you're stuck in rather than the feature you have
        in mind — it often turns out there's a simpler way to solve it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered
      description: Existing features that nearly work, or how other apps handle it.

  - type: checkboxes
    id: constraints
    attributes:
      label: Does this need a server?
      description: >
        Colloquium has no backend by design — every peer holds its own data and
        talks directly to others. Features needing always-on hosted state
        generally don't fit.
      options:
        - label: I believe this works without any always-on server
